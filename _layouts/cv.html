---
layout: default
---
{% assign cv_pdf_url = page.cv_pdf | prepend: 'assets/pdf/' | relative_url %}

<div class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  {% if page.cv_pdf %}
  <article class="cv-page">
    <div class="cv-toolbar">
      <a href="{{ cv_pdf_url }}" class="cv-download-btn" download>
        <i class="fas fa-file-pdf" aria-hidden="true"></i>
        Download PDF
      </a>
    </div>

    <p class="cv-mobile-note">PDF preview is unavailable on small screens. Use the button above to download or open the CV.</p>

    <div class="cv-viewer">
      <iframe src="{{ cv_pdf_url }}" title="{{ page.title | escape }} PDF" loading="lazy"></iframe>
    </div>
  </article>
  {% endif %}
</div>
